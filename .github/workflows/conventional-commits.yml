name: Conventional commits

# See .github/scripts/check-conventional-commits.mjs for what is checked and why.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            release-please-config.json
            .github/scripts/check-conventional-commits.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The parser release-please itself depends on. Keep the version in step
      # with the one release-please-action resolves.
      - name: Install release-please's commit parser
        run: npm install --no-save --no-audit --no-fund --no-package-lock @conventional-commits/parser@0.4.1

      - name: Check PR title and commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/check-conventional-commits.mjs
